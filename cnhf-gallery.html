<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNCH Residency Orientation — Wayne B Photography</title>
  <meta name="description" content="Central Neighborhood Christian Health — Residency Program Orientation, June 26 2026. Photography by Wayne B." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black:#0d0d0d; --white:#fff; --grey-1:#f5f5f3; --grey-2:#e8e8e4; --grey-3:#999996; --grey-4:#555552; --font:'Inter','Helvetica Neue',Arial,sans-serif; --serif:'Georgia','Times New Roman',serif; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--white); color: var(--black); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    nav { position: fixed; top:0; left:0; right:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:1.25rem 2.5rem; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--grey-2); }
    .nav-logo { font-size:.875rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
    .nav-back { font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-4); display:flex; align-items:center; gap:.5rem; }
    .nav-back:hover { color:var(--black); }

    .event-hero { margin-top:62px; background:var(--black); color:var(--white); padding:4rem 2.5rem 3rem; }
    .event-label { font-size:.6875rem; letter-spacing:.18em; text-transform:uppercase; opacity:.5; margin-bottom:.75rem; }
    .event-title { font-family:var(--serif); font-size:clamp(1.75rem,4vw,3rem); font-weight:400; line-height:1.15; margin-bottom:.75rem; }
    .event-meta { font-size:.8125rem; color:rgba(255,255,255,0.5); letter-spacing:.05em; }

    .gallery-wrap { padding:3rem 2.5rem; }
    .gallery-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
    .photo-count { font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--grey-3); }
    .btn-drive { display:inline-flex; align-items:center; gap:.5rem; padding:.65rem 1.5rem; background:var(--black); color:var(--white); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; transition:opacity .2s; }
    .btn-drive:hover { opacity:.75; }

    .masonry { columns:3; column-gap:3px; }
    @media (max-width:900px) { .masonry { columns:2; } }
    @media (max-width:520px) { .masonry { columns:1; } .gallery-wrap { padding:2rem 1rem; } nav { padding:1rem 1.25rem; } }

    .photo-item { break-inside:avoid; margin-bottom:3px; overflow:hidden; position:relative; background:var(--grey-1); cursor:zoom-in; }
    .photo-item img { display:block; width:100%; height:auto; transition:transform .45s cubic-bezier(.25,.46,.45,.94); }
    .photo-item:hover img { transform:scale(1.03); }

    /* Lightbox */
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; }
    .lightbox.active { display:flex; }
    .lightbox img { max-width:90vw; max-height:90vh; object-fit:contain; }
    .lightbox-close { position:absolute; top:1.5rem; right:2rem; color:#fff; font-size:2rem; cursor:pointer; opacity:.7; line-height:1; }
    .lightbox-close:hover { opacity:1; }
    .lightbox-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.1); color:#fff; border:none; padding:1rem 1.25rem; font-size:1.25rem; cursor:pointer; }
    .lightbox-nav:hover { background:rgba(255,255,255,.2); }
    .lightbox-prev { left:1rem; }
    .lightbox-next { right:1rem; }

    footer { padding:2rem 2.5rem; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--grey-2); font-size:.75rem; color:var(--grey-3); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Wayne B Photography</a>
  <a href="client-galleries.html" class="nav-back">← All galleries</a>
</nav>

<div class="event-hero">
  <p class="event-label">Corporate · Health</p>
  <h1 class="event-title">Central Neighborhood Christian Health<br>Residency Orientation</h1>
  <p class="event-meta">June 26, 2026 &nbsp;·&nbsp; San Diego, CA &nbsp;·&nbsp; Photography by Wayne B</p>
</div>

<div class="gallery-wrap">
  <div class="gallery-info">
    <span class="photo-count">50+ edited photos</span>
    <a href="https://drive.google.com/drive/folders/1oNPChtbpwyYi26KTMIty5D2uLj3hKQo4" target="_blank" class="btn-drive">
      ↗ View &amp; Download All
    </a>
  </div>

  <div class="masonry" id="gallery">
    <!-- Photos loaded from Google Drive via thumbnail URLs -->
    <!-- Note: Set the Drive folder to "Anyone with the link can view" for public access -->

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">×</span>
  <button class="lightbox-nav lightbox-prev" onclick="changePhoto(-1)">‹</button>
  <img id="lightbox-img" src="" alt="" />
  <button class="lightbox-nav lightbox-next" onclick="changePhoto(1)">›</button>
</div>

<footer>
  <span>© 2026 Wayne B Photography. All rights reserved.</span>
  <a href="https://drive.google.com/drive/folders/1oNPChtbpwyYi26KTMIty5D2uLj3hKQo4" target="_blank" style="color:inherit;">Download Full Gallery</a>
</footer>

<script>
// Google Drive photo IDs — 9 featured picks from today's shoot
const photoIds = [
  "1vGJ4LQ4T8YW7cn3DSqCrevIXg4N6CJ-F",
  "1UwTNet9aZxlaKwz1cnzbJIVNbjQsXUGg",
  "19EtrjKXl7UDEaxwpBBA5h6Ix1prgb8bs",
  "1Q94wveOZNTEjXOtvGKnwsWaLHMsOnSeO",
  "1L5U8KH4vJGSUCIXJZ07XXWZi7z6nNhXv",
  "1VXoUP-fDsjn-98x_AI4Z4nLBig-Pa1vW",
  "1UrrY1vKvHBDGcobMNZxsV7kAWRbQNySu",
  "1v68KA-HrvHmfpTire2i108jkoLKjKC1S",
  "1gU4wh70SEoJVYta1EEjV3QBMg4_pu-yY",
  "1iBr8ZStC-OYthrtUYSD-6cc8fmVDnC4h",
  "1ggXGUB_twkmd1lqZXbgmlJi5UfwgP27c",
  "1KxUPVXPZ7dkjtaYgcah0aLZJAkL256GG",
  "1au0HcLSZrwn2rFbSGghsYIn61Z_ijmyH",
  "1FohZufhU75q58immgh1D7Oia8KteKmmp",
  "1BIyTEJhoyHg71YiOAe7vbZN5FoDL-3Ue",
  "1qzqocDU1-GoWhpxe-XwzoKmWg_C5QLHC",
  "1J5XZWltJ54TzdCgVcl6jCBpYLPvpUJCO",
  "1Mqvuzmz8bKT6gvyxswATzMoEpbr7N6YF"
];

const gallery = document.getElementById('gallery');
let currentIdx = 0;

photoIds.forEach((id, i) => {
  const item = document.createElement('div');
  item.className = 'photo-item';
  const img = document.createElement('img');
  img.src = `https://lh3.googleusercontent.com/d/${id}=w1200`;
  img.alt = `CNCH Residency Orientation — Photo ${i + 1}`;
  img.loading = 'lazy';
  img.onclick = () => openLightbox(i);
  item.appendChild(img);
  gallery.appendChild(item);
});

function openLightbox(idx) {
  currentIdx = idx;
  document.getElementById('lightbox-img').src =
    `https://lh3.googleusercontent.com/d/${photoIds[idx]}=w2000`;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function changePhoto(dir) {
  currentIdx = (currentIdx + dir + photoIds.length) % photoIds.length;
  document.getElementById('lightbox-img').src =
    `https://lh3.googleusercontent.com/d/${photoIds[currentIdx]}=w2000`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') changePhoto(1);
  if (e.key === 'ArrowLeft') changePhoto(-1);
});
</script>
</body>
</html>
